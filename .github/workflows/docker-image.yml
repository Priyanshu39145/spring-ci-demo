#This represents the name of the Github Action ---- Give a meaningful name
name: Image Make -> Push -> Deploy

#This represents on which action will the pipeline run ---- Here we have configured that the Github Action will only run on a push to main branch
#We have avoided pipeline running on a pull request
on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

#Here jobs represent the steps in the process ---- build-and-deploy represent the name of the job
#Whenever we define a job in github actions ---- it runs on its own machine called runner machine ---- So there is a temporary machine that is provisioned where all the below steps are run
#Once the job is done ---- the machine is destroyed.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
#Now what will be the steps
# 1. Checkout Code
# 2. Setup Java
# 3. Build a jar
# 4. Login to dockerhub
# 5. Build an image
# 6. Push the image to dockerhub
# 7. Deploy to EC2 using SSH
# ***Remember we may have a question as to whether we had to install the docker in the runner machine ---- Answer is No ---- Github Hosted runner machines have Docker Pre Installed

#uses --- It actually selects an action --- from the Actions Marketplace we can get preconfigured Actions --- these are designed to automate some generic tasks like Java Code Checkout
# We can either use raw commands with name ---> run or we can use preconfigured actions ---- using name ----> uses
    steps:
#Here we checkout the code
    - name: Checkout Code
      uses: actions/checkout@v4

  #Here we are setting up Java using Java 22 version ---- Here preconfigured Action is used
  #with represents the extra information required for the action to perform
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
          distribution: temurin
          java-version: '22'

#Here we are building the jar using raw commands
    - name: Build Jar
      run: ./mvnw clean package -DskipTests

#Here we are loggin in to dockerhub using preconfigured action ---- see the username is not given in the command
#The username is present in Github Secrets env file ---- so that the name is not leaked to public repo
    # - name: Login to DockerHub
    #   run: docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

#Building the image step using raw command ---- again the dockerhub username is not revealed
    - name: Build an image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-ci-demo:latest

 #Pushing the image to dockerhub by raw command
    - name: Push the image to dockerhub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-ci-demo:latest

      
  #This step deploys the app to ec2
  #For doing this first we need to connect to an EC2 instance using SSH
  #To connect we use a predefined action ---- inside the predefined action we provide the host, username and ssh key through environment variables
  #Then once we are connected to SSH ---- we write the script in it ---- 
  #Inside the script first we stop the existing container named "spring demo" ----> Then we delete the container ---> Then we pull the image from dockerhub ---> Then we create and run the container
    - name: Deploy to EC2 using SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }} 
        username: ${{ secrets.EC2_USER }} 
        key: ${{ secrets.SSH_KEY }}
        script: |
          docker stop spring-demo || true
          docker rm spring-demo || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spring-ci-demo:latest
          docker run -d --name spring-demo -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/spring-ci-demo:latest
          
          
      
